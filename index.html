from pyscript import when, document
from js import window

@when("click", "a")
def thank_you(event):
    event.preventDefault()

    link = event.currentTarget.href

    document.querySelector("#message").innerText = "Awwh, thanks for clicking!"

    window.setTimeout(
        lambda: window.location.assign(link),
